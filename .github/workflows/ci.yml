name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: format · build · vet · test · e2e
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.25.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Format gate
        shell: bash
        run: |
          files="$(gofmt -l .)"
          test -z "$files" || { printf 'Files need gofmt:\n%s\n' "$files"; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 -race ./...

      - name: Release binary E2E
        shell: bash
        run: ./scripts/e2e-release.sh

  module-integrity:
    name: module integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Verify go.mod and go.sum are reproducible
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify
